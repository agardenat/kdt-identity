# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # L'image porte le serveur et le contrôleur. Elle était construite à la main jusqu'ici, donc
  # sans garantie que ce qui tourne corresponde au tag.
  #
  # linux/amd64 seulement. La jambe arm64 était émulée par QEMU : elle prenait à elle seule plus
  # d'une heure sur les quatre-vingts minutes du job, pour une architecture qu'aucun cluster visé
  # n'utilise. La rétablir demande de remettre `docker/setup-qemu-action` et la seconde plateforme
  # ci-dessous — et vaut alors mieux par un runner arm natif que par l'émulation.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/${{ github.repository }}:$version"
          # `latest` ne suit que les versions finales : une pré-version le ferait pointer sur une
          # alpha pour tous ceux qui ne pinnent pas.
          case "$version" in
            *-*) ;;
            *) tags="$tags,ghcr.io/${{ github.repository }}:latest" ;;
          esac
          echo "TAGS=$tags" >> $GITHUB_ENV

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}

  # Le chart part avec l'image, vers le dépôt de charts servi par GitHub Pages : un
  # `helm repo add kdt https://agardenat.github.io/helm-charts` suffit alors à l'installer, sans
  # copie du dépôt. Une pré-version peut y figurer sans danger — Helm ne retient une version
  # instable que si `--devel` ou un `--version` explicite la demande.
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Dépôt de charts
        uses: actions/checkout@v4
        with:
          repository: agardenat/helm-charts
          token: ${{ secrets.CHARTS_TOKEN }}
          path: charts-repo

      - name: Empaqueter et réindexer
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          url="https://agardenat.github.io/helm-charts"
          # Deux dépôts publient dans le même index : un push peut être refusé parce que l'autre
          # est passé entre-temps. On repart alors de l'état distant et on refait le paquet —
          # `helm repo index` reconstruit l'index depuis les archives présentes, il n'y a aucune
          # fusion à faire à la main.
          for attempt in 1 2 3; do
            git -C charts-repo fetch origin main
            git -C charts-repo reset --hard origin/main
            git -C charts-repo clean -fd
            # Le tag fait foi : le chart publié porte la version qui a déclenché la CI, même si
            # le Chart.yaml du dépôt n'avait pas été bumpé.
            helm package deploy/helm/kdt-identity \
              --version "$version" --app-version "$version" --destination charts-repo
            cd charts-repo
            helm repo index . --url "$url"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --cached --quiet; then
              echo "kdt-identity $version est déjà publié"
              exit 0
            fi
            git commit -m "kdt-identity $version"
            git push && exit 0
            cd ..
          done
          echo "publication du chart refusée après trois tentatives" >&2
          exit 1

  # Le plugin s'installe sur des postes : il lui faut des binaires, pas une image.
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools rpm

      # Les deux scripts compilent le binaire eux-mêmes — statique, parce que le plugin atterrit
      # sur des postes dont on ne connaît ni la distribution ni la version de la libc. Le tarball
      # ci-dessous reprend ce même binaire, il n'y a qu'une compilation.
      - name: Construire le .deb et le .rpm
        run: |
          packaging/build-deb.sh
          packaging/build-rpm.sh

      - name: Tarball du binaire statique
        run: |
          cp target/x86_64-unknown-linux-musl/release/kdt-identity .
          tar czf kdt-identity-linux-x86_64.tar.gz kdt-identity

      - name: Notes de version depuis le CHANGELOG
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          # `prerelease` vaut false par défaut, sans aucune détection SemVer : sans cette ligne,
          # une v1.1.0-alpha.1 serait publiée comme la dernière version stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            kdt-identity-linux-x86_64.tar.gz
            dist/*.deb
            dist/**/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: cargo build --release --locked --bin kdt-identity --target aarch64-apple-darwin
      - run: cargo build --release --locked --bin kdt-identity --target x86_64-apple-darwin

      - run: |
          lipo -create -output kdt-identity \
            target/aarch64-apple-darwin/release/kdt-identity \
            target/x86_64-apple-darwin/release/kdt-identity
          tar czf kdt-identity-macos-universal.tar.gz kdt-identity

      - name: Notes de version depuis le CHANGELOG
        run: packaging/changelog-section.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: kdt-identity-macos-universal.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
