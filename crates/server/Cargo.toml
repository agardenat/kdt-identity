[package]
name = "kdt-identity-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kdt-identity-api = { version = "1.0.0", path = "../api" }
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
base64.workspace = true
rcgen.workspace = true
x509-parser = { version = "0.16", features = ["verify"] }
x509-cert = { version = "0.3", features = ["builder"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
der = "0.8"
signature = "3"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = { version = "0.11.0", features = ["oid"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "=0.3.31"
argon2 = { version = "0.5", features = ["std"] }
totp-rs = { version = "6", features = ["gen_secret", "otpauth", "zeroize"] }
getrandom = "0.4.3"
subtle = "2.6.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "rustls-native-certs", "rustls-tls", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
hmac = "0.13"
# `default-features = false` écarte `sync` et surtout `tls`, qui tirerait native-tls et donc
# openssl. `tls-rustls-ring` reprend la pile déjà en place — rustls 0.23 sur ring — et laisse
# l'application installer le provider, ce que fait `install_crypto_provider()`.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
# Le seul client HTTP sortant du serveur, et il ne sert qu'au fournisseur d'identité : mêmes
# features que dans le plugin, pour que les deux binaires partagent la pile TLS déjà en place.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
# Les promotions de connexion — `kubectl exec`, `attach`, `port-forward`, `cp` — ne se relaient
# pas avec un client HTTP ordinaire : il faut la connexion brute des deux côtés du 101, et une
# négociation forcée en HTTP/1.1, l'apiserver ne promouvant pas au-dessus de h2. D'où hyper en
# direct, à côté de `kube::Client` qui reste le chemin de tout le reste.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Même version que celle dont `kube::Config` enveloppe ses jetons : la lui reprendre évite deux
# types `SecretString` incompatibles dans le même programme.
secrecy = "0.10"
maud = "0.27"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
der = "0.8"
p256 = "0.14"
x509-cert = { version = "0.3", features = ["builder"] }
x509-parser = { version = "0.16", features = ["verify"] }
