[package]
name = "kdt-identity-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
kdt-identity-api = { version = "1.0.0", path = "../api" }
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
base64.workspace = true
rcgen.workspace = true
x509-parser = { version = "0.16", features = ["verify"] }
x509-cert = { version = "0.3", features = ["builder"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
der = "0.8"
signature = "3"
zeroize = { version = "1", features = ["zeroize_derive"] }
sha2 = { version = "0.11.0", features = ["oid"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
futures = "=0.3.31"
argon2 = { version = "0.5", features = ["std"] }
totp-rs = { version = "6", features = ["gen_secret", "otpauth", "zeroize"] }
getrandom = "0.4.3"
subtle = "2.6.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "rustls-native-certs", "rustls-tls", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
hmac = "0.13"
# `default-features = false` écarte `sync` et surtout `tls`, qui tirerait native-tls et donc
# openssl. `tls-rustls-ring` reprend la pile déjà en place — rustls 0.23 sur ring — et laisse
# l'application installer le provider, ce que fait `install_crypto_provider()`.
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
axum = "0.8"
maud = "0.27"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
der = "0.8"
p256 = "0.14"
x509-cert = { version = "0.3", features = ["builder"] }
x509-parser = { version = "0.16", features = ["verify"] }
