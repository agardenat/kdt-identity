[workspace]
resolver = "2"
members = ["crates/api", "crates/server", "crates/cli"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/agardenat/kdt-identity"

[workspace.dependencies]
kube = { version = "3.1", default-features = false, features = ["client", "derive", "runtime", "rustls-tls", "socks5"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "ring"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
