{{- if .Values.networkPolicy.enabled }}
{{/*
  kdt-identity peut forger n'importe quelle identité du cluster. Un composant de ce poids n'a
  aucune raison de joindre autre chose que l'apiserver, le DNS et, le cas échéant, un relais
  SMTP : tout le reste est refusé.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kdt-identity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kdt-identity.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- else }}
    # Aucune source déclarée : seul le trafic depuis le même namespace atteint le portail.
    # Renseigner networkPolicy.ingressFrom avec le sélecteur du contrôleur d'ingress.
    - from:
        - podSelector: {}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
  egress:
    # DNS, sans quoi rien ne résout.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # L'apiserver. Le CIDR n'est pas connu du chart : à restreindre au vôtre en production,
    # l'ouverture large ci-dessous n'étant qu'un défaut praticable.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- if .Values.smtp.enabled }}
    - ports:
        - port: {{ .Values.smtp.port }}
          protocol: TCP
    {{- end }}
{{- end }}
