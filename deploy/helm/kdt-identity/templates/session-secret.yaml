{{/*
  Clé de signature des sessions.

  `lookup` relit la clé déjà installée pour qu'une montée de version ne déconnecte pas tout le
  monde. Sans cette précaution, chaque `helm upgrade` engendrerait une clé neuve et
  invaliderait toutes les sessions en cours.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-session" (include "kdt-identity.fullname" .)) -}}
{{- $key := "" -}}
{{- if .Values.sessionKey -}}
  {{- $key = .Values.sessionKey | b64enc -}}
{{- else if and $existing $existing.data -}}
  {{- $key = index $existing.data "session-key" -}}
{{- else -}}
  {{- $key = randBytes 32 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kdt-identity.fullname" . }}-session
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
type: Opaque
data:
  session-key: {{ $key }}
