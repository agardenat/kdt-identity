{{- if and (eq .Values.authMode "oidc") .Values.oidcAuth.caCert }}
{{/*
  L'autorité qui a émis le certificat du fournisseur d'identité.

  Dans un ConfigMap et non un Secret, pour la même raison que celle de l'annuaire : une CA est
  publique par construction.

  Un seul volume, là où l'annuaire en demande deux : le client HTTP du portail reçoit cette
  autorité directement et l'ajoute aux racines publiques, sans magasin à assembler au démarrage —
  c'est la bibliothèque LDAP, et elle seule, qui impose ce détour par SSL_CERT_FILE.

  Inutile face à Entra ID ou Okta, dont l'autorité est déjà dans le magasin de l'image.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kdt-identity.fullname" . }}-oidc-ca
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
data:
  ca.crt: |
{{ .Values.oidcAuth.caCert | indent 4 }}
{{- end }}
