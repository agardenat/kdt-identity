{{/*
  Le RBAC de kdt-identity.

  Choisir une identité auprès de l'apiserver — en approuvant une CSR
  « kubernetes.io/kube-apiserver-client », ou en se faisant passer pour quelqu'un — rend ce
  ServiceAccount, de fait, équivalent cluster-admin. C'est vrai des deux modes, et c'est la
  nature du produit : un composant qui distribue des identités en détient forcément le pouvoir.

  Chaque règle est donc réduite au strict nécessaire, et les deux familles s'excluent : le mode
  proxy ne signe pas, les autres n'impersonnent pas.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kdt-identity.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kdt-identity.fullname" . }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
rules:
  # Les identités elles-mêmes. Aucune écriture sur la spec : créer et modifier des comptes
  # relève de l'administrateur, pas du contrôleur, qui n'en dérive que le statut.
  - apiGroups: ["identity.kdt.sh"]
    resources: ["kdtusers", "kdtgroups"]
    verbs: ["get", "list", "watch"]
{{- if eq .Values.authMode "ldap" }}

  # En authMode=ldap, l'administrateur des comptes est l'annuaire : le portail crée le KdtUser à
  # la première connexion réussie, et reporte l'appartenance dans KdtGroup.spec.members.
  #
  # Ce n'est pas l'élargissement qu'on croit. Ce ServiceAccount approuve déjà des CSR
  # « kube-apiserver-client » — il peut donc se forger n'importe quelle identité du cluster, y
  # compris sans passer par un KdtUser. Créer un compte n'ajoute aucune classe de pouvoir à
  # celui-là, et la ValidatingAdmissionPolicy continue de contraindre les noms.
  #
  # `delete` reste absent, en revanche : un compte disparu de l'annuaire est désactivé, jamais
  # supprimé, parce qu'une suppression emporterait ses Secrets par cascade et qu'une panne de
  # lecture prise pour une disparition ferait perdre des comptes.
  - apiGroups: ["identity.kdt.sh"]
    resources: ["kdtusers", "kdtgroups"]
    verbs: ["create", "update", "patch"]
{{- end }}
  - apiGroups: ["identity.kdt.sh"]
    resources: ["kdtusers/status", "kdtgroups/status"]
    verbs: ["get", "update", "patch"]

{{- if eq .Values.credentialMode "proxy" }}

  # En mode proxy, kdt-identity ne signe plus rien : il relaie, en se faisant passer pour le
  # compte qui présente un jeton valide. D'où l'échange, et non le cumul — les règles de
  # signature ci-dessous ne sont pas rendues, et c'est une surface de moins.
  #
  # Le pouvoir est du même ordre que celui qu'elles donnaient. `impersonate` sans `resourceNames`
  # permet de se présenter comme n'importe qui, exactement comme approuver une CSR
  # « kube-apiserver-client » permettait de s'en forger l'identité : ce ServiceAccount reste, de
  # fait, équivalent cluster-admin, ni plus ni moins qu'avant.
  #
  # `resourceNames` ne borne rien ici : il n'accepte pas de joker, donc couvrir `kdt:*`
  # supposerait que le contrôleur tienne la liste à jour — et pour l'écrire il lui faudrait
  # `escalate` sur sa propre règle, ce qui lui rendrait aussitôt le pouvoir que la borne
  # prétendait lui retirer. La garantie est ailleurs, dans le type `Subject` : le proxy ne sait
  # construire aucune identité qui ne commence pas par `kdt:`.
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["uids"]
    verbs: ["impersonate"]
{{- else }}

  # Les demandes de signature sont éphémères : créées, approuvées, lues, puis supprimées.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # `patch` autant qu'`update` : l'émetteur pose la condition Approved par un PATCH, et un
  # ClusterRole qui n'accorde que `update` laisse passer tout le reste du parcours — le compte
  # s'active, la session s'ouvre — pour échouer au seul moment qui compte, l'émission.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests/approval"]
    verbs: ["update", "patch"]

  # La règle la plus sensible du chart. Sans `resourceNames`, kdt-identity pourrait approuver
  # des demandes pour n'importe quel signeur du cluster, y compris ceux qui émettent des
  # certificats serveur ou des identités de kubelet.
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    resourceNames: ["kubernetes.io/kube-apiserver-client"]
    verbs: ["approve"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kdt-identity.fullname" . }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kdt-identity.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kdt-identity.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{/*
  Les Secrets de credentials sont namespacés, et volontairement hors du ClusterRole : rien ne
  justifie que kdt-identity puisse lire les Secrets d'un autre namespace.

  `list` est absent : le contrôleur accède toujours à un Secret par son nom. Sans ce verbe, une
  faille dans le portail ne permet pas d'énumérer les comptes du cluster.

  En mode OIDC, les mêmes verbes couvrent deux objets de plus : la clé de signature, créée au
  premier démarrage, et un Secret de sessions par compte, dont la suppression est la révocation.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kdt-identity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kdt-identity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "kdt-identity.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kdt-identity.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kdt-identity.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
