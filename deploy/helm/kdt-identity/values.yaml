# Nom du cluster tel qu'il apparaît aux utilisateurs, dans le portail et dans leur kubeconfig.
clusterName: ""

# Racine publique du portail. Sert à construire les liens d'activation, qui sont envoyés à des
# gens : elle doit être l'adresse qu'ils peuvent réellement ouvrir.
portalUrl: ""

# Adresse publique de l'apiserver, telle que les postes de travail l'atteignent.
#
# Ce n'est pas https://kubernetes.default.svc : cette URL finit dans le kubeconfig d'un
# utilisateur, qui n'est pas dans le cluster.
apiserverUrl: ""

# Racine publique de kdt-web, si elle est déployée. Vide, il ne se passe rien : le flow
# d'autorisation n'est pas monté, et la page du compte n'en dit pas un mot.
#
# kdt-web est une installation séparée et facultative — son propre chart, sa propre image. Ce
# champ ne fait que déclarer au portail qu'elle existe et qu'elle a le droit de demander des
# identités. Rien n'est détecté : un lien affiché parce qu'un Service existe serait mort le temps
# qu'un ingress se propage.
#
# Deux conséquences à connaître avant de la renseigner :
#
#   - https est exigé. Le code d'autorisation voyage dans une URL et s'échange contre un droit de
#     session ; en clair, il est lisible par tout ce qui se trouve sur le trajet.
#   - Servez kdt-web sous le **même domaine enregistrable** que le portail —
#     `kdt.example.com` et `identity.example.com`. Le cookie de session est `SameSite=Strict` :
#     depuis un autre domaine, le navigateur ne l'enverra pas, et chaque autorisation repassera
#     par une connexion complète.
#
# L'adresse de retour en découle et n'a pas à être déclarée : c'est <webUrl>/auth/callback, la
# seule que le portail acceptera.
webUrl: ""

image:
  repository: ghcr.io/agardenat/kdt-identity
  pullPolicy: IfNotPresent
  # Par défaut, l'appVersion du chart.
  tag: ""

logLevel: kdt_identity_server=info

serviceAccount:
  name: ""

controller:
  # Une seule instance : le contrôleur n'a pas d'élection de leader, et deux réplicas
  # réconcilieraient les mêmes objets en concurrence. Les écritures sont idempotentes, mais le
  # gain serait nul et les conflits réels.
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

portal:
  replicas: 1
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

  # Le portail propose-t-il un kubeconfig à télécharger ?
  #
  # C'est le seul accès que la révocation ne peut pas couper : le fichier est autoportant,
  # personne ne le renouvelle, et il vit donc `downloadCertTtl` quoi qu'il arrive. En échange,
  # il n'y a rien à installer sur le poste — ce qui est une des raisons d'être du portail.
  #
  # À désactiver dès lors que la révocation doit être sans exception : sinon quiconque a encore
  # son mot de passe contourne la fermeture de ses sessions en repassant par le portail.
  kubeconfigDownload: true

  # Durée de validité de ce kubeconfig, entre 10m et 30d. Dix minutes n'aurait aucun sens ici :
  # le fichier serait périmé avant d'être rangé.
  downloadCertTtl: 8h

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: true
    secretName: ""

# Ce que le portail remet aux utilisateurs : `certificate` ou `oidc`.
#
# `certificate` — le défaut — signe des certificats X.509 avec la CA du cluster. Ne demande
# aucune configuration de l'apiserver, fonctionne sur les clusters managés dont les drapeaux ne
# sont pas accessibles, mais ne se révoque pas : un certificat émis vaut jusqu'à son expiration.
#
# `oidc` émet des jetons de quelques minutes, renouvelés contre un droit conservé dans le
# cluster. La révocation devient immédiate et les groupes sont relus à chaque renouvellement,
# au prix d'une configuration de l'apiserver — voir docs/oidc.md. Le mode se choisit une fois :
# en changer invalide les accès déjà distribués.
credentialMode: certificate

# Durée de validité des certificats remis au plugin, entre 10m et 30d. Sans effet en mode oidc.
#
# Dix minutes, soit le plancher de l'API Kubernetes : c'est le délai maximal entre une
# révocation et sa prise d'effet, et il ne coûte rien puisque le plugin renouvelle tout seul.
#
# Le plafond réel est celui du signeur du cluster (`--cluster-signing-duration`, 24 h par
# défaut) : au-delà, la durée demandée est raccourcie sans erreur, et l'émission le journalise.
certTtl: 10m

# Durée de validité du droit de renouveler, entre 1h et 90d.
#
# C'est l'intervalle entre deux saisies de mot de passe et de code. Aussi long n'aurait pas de
# sens sans révocation ; ici, ce droit vit dans le cluster et se retire à tout moment — par
# `kdt-identity-server revoke`, ou en posant `spec.disabled` sur le compte.
refreshTtl: 7d

oidc:
  # Audience attendue dans les jetons. À reporter à l'identique dans la configuration de
  # l'apiserver : `--oidc-client-id`, ou `audiences` en configuration structurée.
  audience: kdt-identity
  # Durée de vie d'un jeton d'identité, entre 60s et 1h.
  #
  # Même rôle que `certTtl` en mode certificat : le délai maximal entre une révocation et sa
  # prise d'effet. Peut descendre plus bas qu'un certificat, dont le plancher est imposé par
  # l'API Kubernetes.
  tokenTtl: 5m

# Clé de signature des sessions, 32 octets en base64.
#
# Laissée vide, le chart en engendre une et la conserve d'une montée de version à l'autre.
# Sans elle, chaque instance signerait avec la sienne et une session ouverte sur l'une ne
# serait pas reconnue par l'autre.
sessionKey: ""

# Qui reconnaît les personnes.
#
#   local — les comptes vivent dans le cluster : mot de passe Argon2id et TOTP dans un Secret,
#           créés par `kdt-identity-server invite` puis activés depuis le portail.
#   ldap  — les comptes vivent dans un annuaire. Le mot de passe y est vérifié par un bind, le
#           KdtUser est créé à la première connexion réussie, et l'appartenance est reportée
#           depuis les groupes de l'annuaire.
#   oidc  — les comptes vivent chez un fournisseur OpenID Connect (Entra ID, Keycloak, Okta).
#           Le portail ne voit jamais le mot de passe : il redirige le navigateur, et c'est le
#           fournisseur qui répond.
#
# Orthogonal à credentialMode : celui-ci dit ce qu'on remet, celui-là qui on reconnaît. Les six
# combinaisons sont valides.
#
# En mode ldap comme en mode oidc, le second facteur relève de la source : kdt-identity n'enrôle
# plus de TOTP, ne sert plus la page d'activation, et `invite` refuse de s'exécuter. Le mode oidc
# va plus loin : il n'accepte plus aucun mot de passe, nulle part.
authMode: local

ldap:
  # activedirectory | freeipa — préremplit les noms d'attributs du schéma.
  profile: activedirectory

  # Racine de l'annuaire. ldaps:// est attendu ; ldap:// n'est accepté qu'avec startTls, parce
  # qu'un bind présente le mot de passe en clair dans la requête.
  url: ""
  startTls: false

  # Autorité qui a émis le certificat de l'annuaire, en PEM.
  #
  # Presque toujours nécessaire : FreeIPA émet depuis sa propre CA, Active Directory aussi dans
  # la quasi-totalité des cas, et le magasin de l'image ne contient que les autorités publiques.
  # Le serveur assemble au démarrage un magasin réunissant les deux — la bibliothèque LDAP
  # n'ayant aucun moyen de recevoir une autorité pour la seule connexion à l'annuaire.
  caCert: ""
  # À poser si, et seulement si, l'annuaire présente un certificat d'une autorité publique.
  # Lève le garde-fou qui exige caCert ; ne désactive aucune vérification.
  skipCaCheck: false

  # Nom du Secret portant KDT_IDENTITY_LDAP_BIND_DN et KDT_IDENTITY_LDAP_BIND_PASSWORD.
  #
  # Le compte de service ne sert qu'à chercher l'entrée avant de la faire binder. Laissé vide,
  # la recherche est anonyme : FreeIPA l'autorise souvent, Active Directory pratiquement jamais.
  existingSecret: ""

  # Racine sous laquelle chercher les personnes.
  userSearchBase: ""

  # Attributs du schéma. Laissés vides, ils viennent du profil :
  #   activedirectory — sAMAccountName, mail, displayName, memberOf, user
  #   freeipa         — uid,            mail, cn,          memberOf, person
  userLoginAttribute: ""
  userEmailAttribute: ""
  userDisplayAttribute: ""
  groupMemberAttribute: ""
  userObjectClass: ""

  # Correspondance entre les groupes de l'annuaire et les KdtGroup.
  #
  # Rien n'est déduit d'un DN : dériver un nom kdt demanderait de le normaliser, et deux groupes
  # distincts de l'annuaire pourraient alors aboutir au même nom, donc aux mêmes droits. Ce qui
  # ne figure pas ici n'existe pas côté cluster.
  #
  # Le nom du groupe doit être un nom de ressource valide — minuscules, chiffres, - et . — et
  # c'est lui qui donne le sujet RBAC `kdt:<groupe>` à référencer dans vos bindings.
  #
  #   groupMappings:
  #     - dn: "cn=k8s-admins,ou=groups,dc=example,dc=com"
  #       group: admins
  #     - dn: "cn=k8s-devs,ou=groups,dc=example,dc=com"
  #       group: devs
  groupMappings: []

  # Délai au-delà duquel l'annuaire est tenu pour injoignable.
  timeout: 10s

  # Intervalle de relecture de l'annuaire par le contrôleur.
  #
  # Une connexion ne renseigne que la personne qui se connecte. Sans cette relecture, un retrait
  # de groupe côté annuaire n'aurait d'effet qu'à sa prochaine saisie de mot de passe — le
  # renouvellement silencieux ne rebindant jamais, cela peut vouloir dire jusqu'à refreshTtl.
  #
  # Un compte dont l'entrée a disparu de l'annuaire passe en spec.disabled, jamais supprimé.
  resync: 15m

# Fournisseur d'identité, en authMode=oidc.
#
# Le portail devient client du fournisseur : il envoie le navigateur chez lui, en récupère un
# jeton d'identité, et en tire le compte et ses groupes. Le plugin kubectl, lui, ouvre alors sa
# session par le navigateur — il n'a plus de mot de passe à présenter.
oidcAuth:
  # Racine de l'émetteur, telle qu'il se nomme lui-même. Le document de découverte est cherché
  # sous <issuer>/.well-known/openid-configuration, et le champ `issuer` qu'il annonce doit
  # correspondre exactement : c'est aussi ce que porteront les jetons.
  #
  #   Entra ID — https://login.microsoftonline.com/<tenant-id>/v2.0
  #   Keycloak — https://sso.example.com/realms/<realm>
  issuer: ""

  # Identifiant de l'application enregistrée chez le fournisseur.
  clientId: ""

  # Nom du Secret portant KDT_IDENTITY_AUTH_OIDC_CLIENT_SECRET — et, si l'accès à l'API est
  # déclaré ci-dessous, KDT_IDENTITY_AUTH_OIDC_GRAPH_CLIENT_SECRET.
  #
  # Laissé vide, le portail se présente en client public et ne tient que par PKCE. C'est valable,
  # mais Entra ID comme Keycloak distinguent les deux à l'enregistrement : un secret configuré
  # face à un client déclaré public est refusé aussi sûrement que l'inverse.
  existingSecret: ""

  # Adresse de retour à déclarer chez le fournisseur : <portalUrl>/login/callback.
  # Elle se déduit de portalUrl et n'a pas à être répétée ici.

  # Portées demandées. `openid` est ajoutée d'office si elle manque.
  scopes: "openid profile email"

  # Nom du fournisseur tel que la page de connexion le nomme, sur le bouton.
  providerName: ""

  # Noms des claims. Laissés vides, ils valent preferred_username, email, name, groups et sub.
  #
  # Chez Entra ID, `subject: oid` est le meilleur choix — et il devient obligatoire dès que
  # graph.enabled est vrai : `sub` est propre à l'application, l'API du fournisseur ne le connaît
  # pas, et réenregistrer le portail changerait tous les `sub` déjà épinglés.
  claims:
    username: ""
    email: ""
    display: ""
    groups: ""
    subject: ""

  # Correspondance entre les groupes du fournisseur et les KdtGroup.
  #
  # Même règle qu'en LDAP : rien n'est déduit, ce qui ne figure pas ici n'existe pas côté
  # cluster. La clé est la valeur telle qu'elle apparaît dans le claim — chez Entra ID, un GUID.
  #
  #   groupMappings:
  #     - claim: "8f4a1c2e-0b77-4e3b-9a21-2c5d8e7f0a11"
  #       group: admins
  #     - claim: "/platform/devs"
  #       group: devs
  groupMappings: []

  # Autorité qui a émis le certificat du fournisseur, en PEM. Inutile pour un fournisseur public
  # — Entra ID, Okta — dont l'autorité est déjà dans le magasin de l'image.
  caCert: ""

  # Délai au-delà duquel le fournisseur est tenu pour injoignable.
  timeout: 10s

  # Accès à l'API du fournisseur (Microsoft Graph).
  #
  # Facultatif, et pas anodin — il répond à deux manques d'un coup :
  #
  #   1. au-delà d'environ deux cents groupes, Entra ID cesse de les mettre dans le jeton et n'y
  #      laisse qu'un renvoi. Sans cet accès, la personne la mieux dotée en groupes est celle
  #      dont la connexion est refusée ;
  #   2. une session se renouvelle sans jamais revenir au fournisseur. Sans cet accès, un retrait
  #      de groupe fait chez lui n'a d'effet qu'à la prochaine connexion interactive — et
  #      refreshTtl est alors plafonné à 24h pour borner ce retard.
  #
  # Exige une permission d'application — GroupMember.Read.All et User.Read.All — accordée **et**
  # consentie par un administrateur du tenant. Un compte fermé chez le fournisseur passe en
  # spec.disabled, comme une entrée disparue de l'annuaire.
  graph:
    enabled: false
    tenantId: ""
    # Laissé vide, l'application du portail sert : elle a déjà une identité dans le tenant.
    clientId: ""
    endpoint: "https://graph.microsoft.com"
    authority: "https://login.microsoftonline.com"
    resync: 15m

# SMTP est facultatif : l'invitation s'obtient par `kdt-identity-server invite`, qui affiche le
# lien et le code à transmettre. `--send-mail` n'a besoin de ceci que pour envoyer le lien.
# Sans objet en authMode=ldap ni en authMode=oidc, où il n'y a pas d'invitation.
smtp:
  enabled: false
  host: ""
  port: 587
  from: ""
  # starttls | implicit | none
  encryption: starttls
  # Nom du Secret portant KDT_IDENTITY_SMTP_USERNAME et KDT_IDENTITY_SMTP_PASSWORD.
  existingSecret: ""

networkPolicy:
  # Refuse tout par défaut, n'ouvre que ce qui est nécessaire. kdt-identity peut forger
  # n'importe quelle identité du cluster : il n'a rien à faire sur le réseau au-delà de
  # l'apiserver, du DNS et, le cas échéant, du relais SMTP.
  enabled: true
  # Sélecteur des pods autorisés à joindre le portail, typiquement le contrôleur d'ingress.
  ingressFrom: []
  # À activer sur un cluster sous Cilium. La règle egress ci-dessus vise l'apiserver par son
  # CIDR, or Cilium traite le trafic vers un nœud comme les entités `host`/`remote-node`, hors
  # d'atteinte d'un `ipBlock` tant que `policy-cidr-match-mode=nodes` n'est pas posé. Ajoute
  # une CiliumNetworkPolicy qui autorise l'entité `kube-apiserver`, sans rien ouvrir d'autre.
  cilium: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
nameOverride: ""
fullnameOverride: ""
